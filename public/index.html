<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Barrio Claro</title><body><main><h1>Barrio Claro</h1><p>Explica avisos públicos sin inventar datos.</p><form id="f"><label>Aviso público<textarea id="notice" minlength="40" required></textarea></label><button>Explicar</button></form><pre id="out" aria-live="polite"></pre></main><script>const f=document.querySelector("#f"),n=document.querySelector("#notice"),o=document.querySelector("#out");f.addEventListener("submit",async e=>{e.preventDefault();o.textContent="Procesando…";try{const r=await fetch("/api/explain",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({notice:n.value})}),d=await r.json();o.textContent=d.summary||d.error||"Sin respuesta"}catch{o.textContent="No se pudo conectar"}})</script></body></html>
